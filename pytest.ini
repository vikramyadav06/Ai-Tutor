[pytest]
# Tutor tests live in tests/. Subject exercises run with an explicit path, e.g.
#   pytest my-work/setup -v     (Playwright: add --tracing retain-on-failure to keep traces)
testpaths = tests
norecursedirs = core/teaching/lesson-template .venv venv .git learner .tutor archive
addopts = --import-mode=importlib
markers =
    mobile: tests meant to run with --device emulation
