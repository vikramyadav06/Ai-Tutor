# Repo A checks (TECH_SPEC §11). Runs read-only, with no secrets, on every pull request.
# Never use pull_request_target or workflow_run here. Actions are pinned to full commit SHAs;
# Dependabot (.github/dependabot.yml) proposes updates.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tutor:
    name: Tutor tools and lessons
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (tutor packages with hash checking, then pytest)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-tutor.txt
          python -m pip install -r requirements-dev.txt
      - name: Validate subjects and lessons (format and prompt-injection checks)
        run: python tools/validate.py
      - name: Tests
        run: python -m pytest

  playwright-solutions:
    name: Playwright subject solutions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -r core/subjects/playwright-python/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run every reference solution
        run: python -m pytest core/subjects/playwright-python/*/solutions -v
